<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>WebGIS Kedaruratan Nuklir</title>
  
  <!-- CSS Leaflet WAJIB DI HEAD -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #map { height: 500px; width: 100%; border-radius: 8px; border: 1px solid #ccc; }
    .panel { background: #f4f4f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
  </style>
</head>
<body>

  <h2>Peta Kedaruratan Nuklir Nasional</h2>

  <div class="panel">
    <div id="login-form">
      <input type="email" id="email" placeholder="Email Admin">
      <input type="password" id="password" placeholder="Password">
      <button onclick="loginAdmin()">Login Admin</button>
    </div>

    <div id="logged-in-info" style="display: none;">
      <span id="user-email"></span>
      <button onclick="logoutAdmin()">Logout</button>
    </div>

    <p>Mode Akses Saat Ini: <span id="status-text">Publik (Ibu Kota Provinsi)</span></p>
  </div>

  <div id="map"></div>

  <!-- SCRIPT LIBRARY WAJIB SEBELUM SCRIPT UTAMA -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://kedpmwibkkzvnuhlszeu.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZHBtd2lia2t6dm51aGxzemV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5Mjc2NDgsImV4cCI6MjEwNzUwMzY0OH0.AMLnYZmWaoFGcNEK6j19-3cdJgCAJYh_W4dsGhc5gRgv'; // Gunakan Legacy Anon Key (eyJ...)

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const map = L.map('map').setView([-2.5489, 118.0149], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const markerGroup = L.layerGroup().addTo(map);

    async function loadMapData(projectName) {
      markerGroup.clearLayers();
      const { data, error } = await supabase.rpc('get_map_data', {
        target_project: projectName
      });

      if (error) {
        console.error('Error:', error);
        return;
      }

      data.forEach(item => {
        L.marker([item.lat, item.lng])
          .bindPopup(`<b>${item.project_name}</b><br>${item.description}`)
          .addTo(markerGroup);
      });
    }

    async function loginAdmin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert('Login Gagal: ' + error.message);
      } else {
        alert('Login Berhasil!');
        checkSession();
      }
    }

    async function logoutAdmin() {
      await supabase.auth.signOut();
      alert('Logout Berhasil!');
      checkSession();
    }

    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      const statusText = document.getElementById('status-text');

      if (session) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('logged-in-info').style.display = 'block';
        document.getElementById('user-email').innerText = 'Logged in: ' + session.user.email + ' ';
        statusText.innerText = 'Admin (Exact Location Data)';
        statusText.style.color = 'green';
      } else {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('logged-in-info').style.display = 'none';
        statusText.innerText = 'Publik (Ibu Kota Provinsi)';
        statusText.style.color = 'black';
      }

      loadMapData('Kedaruratan Nuklir');
    }

    checkSession();
  </script>
</body>
</html>
